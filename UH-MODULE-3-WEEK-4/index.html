<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>

    <main class="container mt-5">
        <div class="container text-center mb-3">
            <h1>Tasks</h1>
        </div>
        <div class="card mb-5">
            <div class="card-body">
                <form id="createTaskForm">
                    <div class="mb-3">
                        <label for="title" class="form-label">Title</label>
                        <input name="title" type="text" class="form-control" id="title" aria-describedby="emailHelp" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea name="description" class="form-control" id="description" rows="3" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Create</button>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="card w-100">
                    <ul id="table-container" class="list-group list-group-flush">
                    <!--Here come the content-->
                    </ul>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5 task-id" id="">Update Task</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="updateTaskForm">
                        <div class="mb-3">
                            <label for="titleUpdate" class="form-label">Title</label>
                            <input name="titleUpdate" type="text" class="form-control" id="titleUpdate" aria-describedby="emailHelp" required>
                        </div>
                        <div class="mb-3">
                            <label for="descriptionUpdate" class="form-label">Description</label>
                            <textarea name="descriptionUpdate" class="form-control" id="descriptionUpdate" rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" data-bs-dismiss="modal">Update</button>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary w-100" data-bs-dismiss="modal">Cancel</button>
                </div>
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
